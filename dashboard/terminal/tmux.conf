# The owner's chat terminal has a tmux server of its own (tmux -L jack), so
# nothing here changes how any other tmux on this box behaves.
set -g default-terminal "screen-256color"
# every shell here: the usual environment, a short prompt (see bashrc beside this file)
set -g default-command "exec bash --rcfile /home/opc/jackthelearner/dashboard/terminal/bashrc"
set -ga terminal-overrides ",xterm-256color:Tc"
set -g history-limit 50000
# Scrolling: the history lives here, on the server (50,000 lines, and it
# survives the phone disconnecting). A swipe on the page arrives as wheel
# steps; one step moves ONE line, so the page can follow the finger exactly
# and glide. Scrolling back down to the bottom leaves scroll mode by itself.
set -g mouse on
bind -n WheelUpPane if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" "send -M" "copy-mode -e"
bind -T copy-mode WheelUpPane select-pane \; send -X -N 1 scroll-up
bind -T copy-mode WheelDownPane select-pane \; send -X -N 1 scroll-down
bind -T copy-mode-vi WheelUpPane select-pane \; send -X -N 1 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send -X -N 1 scroll-down
set -g status off            # the page has its own title bar; a phone needs the row
# The page draws its own row of window tabs. tmux tells it what windows exist
# through the terminal title, which changes whenever a window opens, closes,
# is renamed or is switched to: "JW|0=bash*|1=claude|". An "m" after JW
# means the window is scrolled back, so the page knows to return to the
# bottom before it types anything.
set -g set-titles on
set -g set-titles-string "JW#{?pane_in_mode,m,}|#{W:#{window_index}=#{window_name}#{?window_active,*,}|}"
set -sg escape-time 10
# tmux guesses that keys arriving under a millisecond apart are a paste and
# then ignores its own key bindings for them. The page sends short bursts on
# purpose (a focus report, then prefix + window number, when a tab is clicked),
# and a burst of three lost the switch and left the prefix half-pressed, so the
# NEXT key typed would have been taken as a tmux command. Real pastes arrive
# bracketed and need no guess. 0 turns the guess off.
set -g assume-paste-time 0
set -g focus-events on
set -g window-size latest    # phone and laptop attached together: the last one used wins
setw -g aggressive-resize on
# PageUp scrolls back with no prefix key (the page's key bar sends it); paging
# back down to the bottom leaves scroll mode by itself.
bind -n PageUp copy-mode -eu
# The page's close button (it asks first): prefix then X closes the current window.
bind X kill-window
# Copying. On a computer a drag selects here, in tmux, and on release tmux hands
# the text to the page (the OSC 52 sequence), which puts it on the clipboard.
# The selection stays lit until the next key, so it is clear what was copied.
# Only tmux itself may set the clipboard ("external"), never a program inside.
set -s set-clipboard external
set -as terminal-features ",xterm*:clipboard"
bind -T copy-mode MouseDragEnd1Pane send -X copy-pipe-no-clear
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-no-clear
