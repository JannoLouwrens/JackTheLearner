# The owner's chat terminal has a tmux server of its own (tmux -L jack), so
# nothing here changes how any other tmux on this box behaves.
set -g default-terminal "screen-256color"
# every shell here: the usual environment, a short prompt (see bashrc beside this file)
set -g default-command "exec bash --rcfile /home/opc/jackthelearner/dashboard/terminal/bashrc"
set -ga terminal-overrides ",xterm-256color:Tc"
set -g history-limit 50000
set -g mouse on              # wheel and swipe scroll back through the conversation
set -g status off            # the page has its own title bar; a phone needs the row
set -sg escape-time 10
set -g focus-events on
set -g window-size latest    # phone and laptop attached together: the last one used wins
setw -g aggressive-resize on
# PageUp scrolls back with no prefix key (the page's key bar sends it); paging
# back down to the bottom leaves scroll mode by itself.
bind -n PageUp copy-mode -eu
