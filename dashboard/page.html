<title>Jack the Learner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one calm column of rounded cards on a soft grouped ground, a floating
   glass tab bar, one hero number, bars everywhere else; detail rises in a sheet. */
:root{
  --bg:#f2f3f7; --card:#ffffff; --inset:#f3f4f8; --ink:#0c0d11; --ink2:#494d57; --ink3:#7f8490;
  --line:rgba(12,16,28,.09); --accent:#2a78d6; --accent-weak:#86b6ef; --track:#dfe9f8;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b; --mute:#a3a7b0;
  --glass:rgba(250,250,252,.78); --scrim:rgba(10,12,20,.38);
  --shadow:0 1px 2px rgba(12,16,28,.04),0 12px 32px rgba(12,16,28,.06);
  --lift:0 1px 3px rgba(12,16,28,.14);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --card:#17181b; --inset:#222327; --ink:#f4f4f7; --ink2:#c5c7ce; --ink3:#8f939c;
    --line:rgba(255,255,255,.11); --accent:#3987e5; --accent-weak:#1c5cab; --track:#152e52;
    --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b; --mute:#6c7079;
    --glass:rgba(30,31,35,.74); --scrim:rgba(0,0,0,.6);
    --shadow:0 0 0 1px rgba(255,255,255,.05); --lift:0 0 0 1px rgba(255,255,255,.08);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --card:#17181b; --inset:#222327; --ink:#f4f4f7; --ink2:#c5c7ce; --ink3:#8f939c;
  --line:rgba(255,255,255,.11); --accent:#3987e5; --accent-weak:#1c5cab; --track:#152e52;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b; --mute:#6c7079;
  --glass:rgba(30,31,35,.74); --scrim:rgba(0,0,0,.6);
  --shadow:0 0 0 1px rgba(255,255,255,.05); --lift:0 0 0 1px rgba(255,255,255,.08);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 120px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}

/* header */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:8px 4px 16px}
.top h1{font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-.022em;margin:0}
.top p{margin:4px 0 0;color:var(--ink3);font-size:15px}
.pill{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:99px;font-size:13px;font-weight:600;background:var(--card);color:var(--ink2);box-shadow:var(--shadow);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mute);flex:none}
.dot.good{background:var(--good)} .dot.warn{background:var(--warn)} .dot.crit{background:var(--crit)} .dot.accent{background:var(--accent)}
.dot.live{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.dot.live{animation:none} *{scroll-behavior:auto!important;transition:none!important}}

/* cards and sections */
.view{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.card{background:var(--card);border-radius:26px;box-shadow:var(--shadow);padding:20px;min-width:0}
.card>h2{font-size:22px;line-height:1.2;font-weight:700;letter-spacing:-.015em;margin:0 0 2px;text-wrap:balance}
.card>.sub{margin:0 0 6px;color:var(--ink3);font-size:14px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin:0 0 8px}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600;font-size:14px;cursor:pointer}
@media (min-width:860px){
  .view.two{grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);align-items:start}
  .view.two>.span{grid-column:1/-1}
  .col{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
}
@media (max-width:859px){.col{display:contents}}

/* hero */
.hero .num{font-size:76px;line-height:.95;font-weight:700;letter-spacing:-.045em}
.hero .of{font-size:22px;font-weight:600;color:var(--ink3);letter-spacing:-.01em;margin-left:4px}
.hero .say{margin:8px 0 14px;color:var(--ink2);font-size:16px;max-width:36em}
.meter{height:8px;border-radius:99px;background:var(--track);overflow:hidden;position:relative}
.meter>i{display:block;position:relative;height:100%;border-radius:99px;background:var(--accent)}
.meter>b{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--accent-weak)}
.key2{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink2);margin:2px 0 4px}
.key2 span{display:inline-flex;align-items:center;gap:7px}
.key2 i{display:inline-block;width:18px;height:8px;border-radius:99px;background:var(--accent)}
.key2 i.w{background:var(--accent-weak)}
.meter.big{height:12px}
.meter.warn>i{background:var(--warn)} .meter.crit>i{background:var(--crit)}
.meter>u{position:absolute;top:0;bottom:0;width:2px;background:var(--ink2);opacity:.55}
.steps{display:flex;gap:5px;margin:16px 0 6px}
.steps i{flex:1;height:8px;border-radius:99px;background:var(--track)}
.steps i.met{background:var(--good)} .steps i.now{background:var(--accent)}
.stepl{list-style:none;margin:12px 0 0;padding:0}
.stepl li{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:7px 0;font-size:15px;color:var(--ink3)}
.stepl li b{font-weight:600;color:var(--ink3);font-variant-numeric:tabular-nums}
.stepl li.met,.stepl li.now{color:var(--ink)} .stepl li.now b,.stepl li.met b{color:var(--ink)}
.stepl li.now span:nth-child(2){font-weight:600}
.stepl li small{display:block;font-size:13px;font-weight:400;color:var(--ink2);margin-top:2px}
.stepl li em{font-style:normal;font-size:13px;color:var(--ink3);white-space:nowrap}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:18px}
.tile{background:var(--inset);border-radius:16px;padding:12px 12px 10px;min-width:0}
.tile .v{font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.tile .v small{font-size:14px;font-weight:600;color:var(--ink3);letter-spacing:0}
.tile .l{font-size:12px;color:var(--ink3);line-height:1.3;margin-top:2px}
.tile svg{display:block;width:100%;height:26px;margin-top:6px}

/* meter list rows */
.rows{margin:6px 0 0;padding:0;list-style:none}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:baseline;width:100%;padding:14px 0;border:0;border-top:1px solid var(--line);background:none;text-align:left;cursor:pointer}
.rows>li:first-child .row,.rows>.row:first-child{border-top:0}
.row .name{font-size:17px;font-weight:600;letter-spacing:-.01em;min-width:0}
.row .fig{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.row .fig i{font-style:normal;color:var(--ink3);font-weight:500;margin-left:6px}
.row .meter,.row .cap{grid-column:1/-1}
.row .cap{font-size:13px;color:var(--ink3);margin-top:-2px}
div.row{cursor:default}
@media (min-width:560px){
  .rows.wide .row{grid-template-columns:190px minmax(0,1fr) 74px;align-items:center}
  .rows.wide .row .meter{grid-column:2;grid-row:1}
  .rows.wide .row .fig{grid-column:3;grid-row:1;text-align:right}
  .rows.wide .row .cap{grid-column:2/-1}
}

/* status chips: icon carries the colour, words stay in ink */
.st{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink2);white-space:nowrap}
.st b{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;font-size:11px;font-weight:700;color:#fff;background:var(--mute)}
.st.good b{background:var(--good)} .st.crit b{background:var(--crit)} .st.serious b{background:var(--serious)}
.st.warn b{background:var(--warn);color:#0b0b0b} .st.accent b{background:var(--accent)}
.chip{display:inline-block;font-size:12px;font-weight:600;color:var(--ink2);background:var(--inset);border-radius:8px;padding:2px 8px;white-space:nowrap}

/* director's note */
.report .lead p{margin:0 0 12px;font-size:17px;line-height:1.5;color:var(--ink);max-width:42em}
.report p{margin:0 0 10px;font-size:15px;line-height:1.5;color:var(--ink2);max-width:44em}
.report p strong,.report li strong{color:var(--ink)}
.report .foryou{margin:6px 0 10px;padding:12px 14px;border-radius:14px;background:var(--track)}
.report .foryou p:last-child{margin-bottom:0}
.rs{border-top:1px solid var(--line)}
.rs summary{list-style:none;cursor:pointer;padding:13px 0;font-size:16px;font-weight:600;color:var(--ink);display:flex;justify-content:space-between;align-items:center;min-height:44px;box-sizing:border-box}
.rs summary::-webkit-details-marker{display:none}
.rs summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--ink3);border-bottom:2px solid var(--ink3);transform:rotate(45deg);transition:transform .2s;margin:0 4px 4px 12px;flex:none}
.rs[open] summary::after{transform:rotate(-135deg);margin-bottom:-4px}
.rl{list-style:none;margin:0 0 10px;padding:0}
.rl li{display:flex;gap:10px;padding:5px 0;font-size:15px;line-height:1.5;color:var(--ink2)}
.rl li::before{content:"";flex:none;width:5px;height:5px;border-radius:50%;background:var(--ink3);margin-top:9px}
.rl li:has(b.n)::before{display:none}
.rl li b.n{flex:none;min-width:14px;color:var(--ink3);font-weight:600}
.feed{list-style:none;margin:10px 0 0;padding:0}
.feed li{padding:11px 0;border-top:1px solid var(--line);font-size:15px;line-height:1.5;color:var(--ink2)}
.feed li:first-child{border-top:0}
.feed li em{display:block;font-style:normal;font-size:13px;color:var(--ink3);margin-bottom:2px}
.note p{margin:0 0 10px;font-size:16px;line-height:1.5;color:var(--ink2);max-width:40em}
.note p strong{color:var(--ink)}
.note.clamp .body{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:6;overflow:hidden}

/* vital signs */
.vital{padding:16px 0;border-top:1px solid var(--line);cursor:pointer;display:block;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.vitals>.vital:first-child{border-top:0;padding-top:8px}
.vital .hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.vital .lab{font-size:15px;font-weight:600}
.vital .val{font-size:28px;font-weight:700;letter-spacing:-.03em;line-height:1.1;margin-top:2px}
.vital .val small{font-size:15px;font-weight:600;color:var(--ink3);letter-spacing:0;margin-left:4px}
.range{position:relative;height:8px;border-radius:99px;background:var(--track);margin:14px 7px 8px}
.range>i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--accent)}
.range>b{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--card)}
.ends{display:flex;justify-content:space-between;gap:12px;font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums}
.ends span:last-child{text-align:right}

/* lives chart */
.chart{position:relative;margin-top:10px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:var(--font);font-size:10px;fill:var(--ink3)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--card);font-size:12px;font-weight:600;line-height:1.35;padding:6px 9px;border-radius:10px;transform:translate(-50%,-100%);white-space:nowrap;z-index:5}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{display:inline-block;width:8px;height:12px;border-radius:3px 3px 0 0;background:var(--accent)}
.legend u{display:inline-block;width:16px;height:2px;border-radius:2px;background:var(--ink2)}
details{margin-top:10px;font-size:13px;color:var(--ink2)}
details summary{cursor:pointer;color:var(--accent);font-weight:600}
table{border-collapse:collapse;margin-top:8px;font-variant-numeric:tabular-nums}
td,th{padding:3px 12px 3px 0;text-align:right;font-weight:500}
th{color:var(--ink3);font-weight:600}
.scroll{overflow-x:auto}

/* worth a look */
.look{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;padding:11px 0;border-top:1px solid var(--line);font-size:15px;line-height:1.4;color:var(--ink2);align-items:start}
.looks>.look:first-child{border-top:0}
.look .st{margin-top:1px}

/* looking back */
#hist{position:relative;margin-top:10px}
#hist svg{display:block;width:100%;height:auto;overflow:visible;touch-action:pan-y}
#hist text{font-family:var(--font);font-size:11px;fill:var(--ink3)}
.day{display:block;width:100%;padding:13px 0;border:0;border-top:1px solid var(--line);background:none;text-align:left;cursor:pointer}
.days>.day:first-child{border-top:0}
.day .when{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--ink3);font-variant-numeric:tabular-nums}
.day .when b{color:var(--ink);font-size:15px;font-weight:600}
.day .txt{margin-top:4px;font-size:15px;line-height:1.45;color:var(--ink2);display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
.day.open .txt{display:block}
.day .txt strong{color:var(--ink)}

/* milestones */
.ms{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.ms .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:700;background:var(--inset);color:var(--ink2);grid-row:1/3}
.ms.met .n{background:var(--good);color:#fff}
.ms .name{font-size:16px;font-weight:600;letter-spacing:-.01em}
.ms .meter{grid-column:2/-1}

/* team, jobs, orders, verdicts */
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:13px 0;border-top:1px solid var(--line)}
.items>.item:first-child{border-top:0}
.item .name{font-size:16px;font-weight:600;letter-spacing:-.01em}
.item>.chip,.item>.st{align-self:start;margin-top:2px}
.item .role,.item .meta{grid-column:1/-1;font-size:13px;color:var(--ink3)}
.item .meta{color:var(--ink2)}
.item .meter{grid-column:1/-1;margin-top:8px}
.item.tap{cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.empty{color:var(--ink3);font-size:15px;margin:8px 0 0}
.banner{background:var(--card);border-radius:20px;padding:14px 16px;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center;font-weight:600}

/* watch and talk */
video{display:block;width:100%;border-radius:18px;background:#000}
.story{font-size:17px;line-height:1.5;color:var(--ink2);margin:14px 0 0;max-width:40em}
.h3{font-size:17px;font-weight:700;letter-spacing:-.01em;margin:22px 0 2px}
.tiles.facts{grid-template-columns:repeat(auto-fill,minmax(112px,1fr))}
.cta{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:#fff;font-weight:600;font-size:17px;padding:13px 22px;border-radius:99px;text-decoration:none;border:0;cursor:pointer}
ol.steps{margin:10px 0 0;padding-left:22px;color:var(--ink2);font-size:16px;line-height:1.5}
ol.steps li{margin-bottom:8px}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.92em;background:var(--inset);border-radius:6px;padding:1px 6px}

/* floating tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;pointer-events:none;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabs .bar{pointer-events:auto;display:flex;gap:2px;padding:5px;border-radius:99px;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);box-shadow:0 10px 34px rgba(0,0,0,.16),0 0 0 1px var(--line)}
.tabs button{border:0;background:none;font-size:15px;font-weight:600;color:var(--ink2);padding:10px 16px;border-radius:99px;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:var(--lift)}
@media (max-width:380px){.tabs button{padding:10px 12px;font-size:14px}}

/* sheet */
.scrim{position:fixed;inset:0;z-index:30;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:90%;overflow:auto;border-radius:28px 28px 0 0;padding:8px max(20px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));overscroll-behavior:contain}
.sheet .grab{width:38px;height:5px;border-radius:99px;background:var(--mute);opacity:.5;margin:2px auto 10px}
.sheet .x{position:sticky;top:6px;float:right;width:32px;height:32px;border-radius:50%;border:0;background:var(--inset);color:var(--ink2);font-size:15px;font-weight:700;cursor:pointer;z-index:2}
.sheet h3{font-size:24px;line-height:1.2;font-weight:700;letter-spacing:-.02em;margin:6px 44px 4px 0;text-wrap:balance}
.sheet h4{font-size:17px;font-weight:700;letter-spacing:-.01em;margin:22px 0 4px}
.sheet p{color:var(--ink2);font-size:16px;line-height:1.5;margin:6px 0;max-width:38em}
.sheet .bigp{font-size:44px;font-weight:700;letter-spacing:-.04em;line-height:1;margin:10px 0 10px}
.sheet .bigp small{font-size:18px;color:var(--ink3);font-weight:600;letter-spacing:0;margin-left:4px}
.tests{list-style:none;margin:8px 0 0;padding:0}
.tests li{display:grid;grid-template-columns:118px minmax(0,1fr);gap:2px 10px;padding:10px 0;border-top:1px solid var(--line);align-items:start}
.tests .tt{font-size:15px;line-height:1.35}
.tests .mt{grid-column:2;font-size:12px;color:var(--ink3)}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:28px;max-height:84%}.sheet .grab{visibility:hidden}}
.foot{color:var(--ink3);font-size:13px;padding:6px 4px;max-width:46em}
</style>

<div class="wrap">
  <header class="top">
    <div><h1>Jack</h1><p id="stamp">&nbsp;</p></div>
    <span class="pill" id="live"><span class="dot"></span><span>Loading</span></span>
  </header>

  <main>
    <section class="view two" id="view-jack"></section>
    <section class="view two" id="view-machine" hidden></section>
    <section class="view" id="view-watch" hidden></section>
    <section class="view" id="view-talk" hidden></section>
  </main>
</div>

<nav class="tabs" aria-label="Sections"><div class="bar" role="tablist">
  <button role="tab" data-tab="jack" id="tab-jack" aria-selected="true">Jack</button>
  <button role="tab" data-tab="machine" id="tab-machine" aria-selected="false">Machine</button>
  <button role="tab" data-tab="watch" id="tab-watch" aria-selected="false">Watch</button>
  <button role="tab" data-tab="talk" id="tab-talk" aria-selected="false">Talk</button>
</div></nav>

<div class="scrim" id="scrim" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1"></div></div>

<script id="snapshot" type="application/json">__SNAPSHOT__</script>
<script>
(function(){
"use strict";
var S=null, openKey=null, lastFocus=null, noteOpen=false, repOpen={}, upAll=false;
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function bold(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")}
function num(x,d){return Number(x).toLocaleString(undefined,{minimumFractionDigits:d||0,maximumFractionDigits:d||0})}
function T(s){return s?new Date(s.length===16?s+":00Z":s):null}
function clock(s){var t=T(s);return t?t.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"}):""}
function day(s){var t=T(s);return t?t.toLocaleDateString(undefined,{day:"numeric",month:"short"}):""}
function span(ms){var m=Math.round(Math.abs(ms)/60000);if(m<1)return "under a minute";if(m<60)return m+" min";var h=Math.floor(m/60),r=m%60;if(h<24)return h+" h"+(r?" "+r+" min":"");var d=Math.floor(h/24);return d+(d===1?" day":" days")}
function ago(s){var t=T(s);if(!t)return "";var ms=Date.now()-t;return ms<60000?"just now":span(ms)+" ago"}
function until(s){var t=T(s);if(!t)return "";var ms=t-Date.now();return ms<=0?"due now":"in "+span(ms)}
function when(s){var t=T(s);if(!t)return "";return (Date.now()-t<20*3600000&&t.getDate()===new Date().getDate())?clock(s):day(s)+", "+clock(s)}
function meter(p,cls,mark){p=Math.max(0,Math.min(100,p));return '<div class="meter '+(cls||"")+'"><i style="width:'+p+'%"></i>'+(mark!=null?'<u style="left:calc('+mark+'% - 1px)"></u>':"")+"</div>"}
/* two tones of one blue: solid for what is proven in Jack himself, lighter for what is proven only beside him */
function meter2(him,all,cls){him=Math.max(0,Math.min(100,him));all=Math.max(him,Math.min(100,all));return '<div class="meter '+(cls||"")+'"><b style="width:'+all+'%"></b><i style="width:'+him+'%"></i></div>'}
var RAN={world:"In Jack himself",bench:"On a test bench",old:"With the earlier brain"};
var APP=(window.matchMedia&&matchMedia("(display-mode: standalone)").matches)||navigator.standalone===true;
var ST={PASS:["✓","Passed","good"],FAIL:["✕","Failed","crit"],VOID:["?","No verdict","warn"],ERROR:["!","Broke down","serious"],BLOCKED:["=","Blocked","warn"],NONE:["·","Not run yet",""],UNWRITTEN:["·","Not written yet",""]};
function st(code){var s=ST[code]||ST.NONE;return '<span class="st '+s[2]+'"><b aria-hidden="true">'+s[0]+"</b>"+s[1]+"</span>"}
var KIND={claim:"Proves the ability",fixture:"Checks the test bench",rule:"Checks a rule of his world",sensor:"Checks the sense delivers",parked:"Set aside for now"};
var WHERE={living:"Measured on the living Jack",rig:"Measured on a test bench",old:"Measured on the old, large brain"};

function spark(vals){
  if(!vals||vals.length<2)return "";
  var w=120,h=26,lo=Math.min.apply(null,vals),hi=Math.max.apply(null,vals),r=(hi-lo)||1;
  var pts=vals.map(function(v,i){return [2+i*(w-8)/(vals.length-1),h-4-(v-lo)/r*(h-9)]});
  var d=pts.map(function(p){return p[0].toFixed(1)+","+p[1].toFixed(1)}).join(" ");
  var e=pts[pts.length-1];
  return '<svg viewBox="0 0 '+w+" "+h+'" preserveAspectRatio="none" aria-hidden="true"><polyline points="'+d+'" fill="none" stroke="var(--mute)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><circle cx="'+e[0].toFixed(1)+'" cy="'+e[1].toFixed(1)+'" r="3" fill="var(--accent)"/></svg>';
}

var journalAll=false,journalOpen={};
function drawHistory(){
  var el=$("#hist"),H=(S&&S.ladder.history)||[];if(!el||H.length<3)return;
  var W=Math.max(280,Math.round(el.clientWidth||320)),Ht=W<520?190:230,ml=30,mr=34,mt=12,mb=24,pw=W-ml-mr,ph=Ht-mt-mb;
  var pts=H.map(function(x){return {t:+new Date(x.d+"T12:00:00Z"),v:x.v,d:x.d}}),t0=pts[0].t,t1=pts[pts.length-1].t;
  var top=Math.max(50,Math.ceil(Math.max.apply(null,pts.map(function(p){return p.v}))/50)*50);
  var X=function(t){return ml+(t-t0)/(t1-t0||1)*pw},Y=function(v){return mt+ph-(v/top)*ph},g="";
  for(var v=0;v<=top;v+=50)g+='<line x1="'+ml+'" x2="'+(W-mr)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--line)" stroke-width="1"/><text x="'+(ml-6)+'" y="'+(Y(v)+4)+'" text-anchor="end">'+v+"</text>";
  var d=new Date(t0);d=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,1));
  while(+d<=t1){g+='<text x="'+X(+d)+'" y="'+(Ht-6)+'" text-anchor="middle">'+d.toLocaleDateString(undefined,{month:"short",timeZone:"UTC"})+"</text>";d=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,1))}
  var line=pts.map(function(p,i){return (i?"L":"M")+X(p.t).toFixed(1)+","+Y(p.v).toFixed(1)}).join("");
  var last=pts[pts.length-1];
  g+='<path d="'+line+"L"+X(t1).toFixed(1)+","+Y(0)+"L"+X(t0).toFixed(1)+","+Y(0)+'Z" fill="var(--accent)" opacity=".10"/>'+
     '<path d="'+line+'" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'+
     '<circle cx="'+X(last.t)+'" cy="'+Y(last.v)+'" r="4" fill="var(--accent)" stroke="var(--card)" stroke-width="2"/>'+
     '<text x="'+(X(last.t)+8)+'" y="'+(Y(last.v)+4)+'" style="fill:var(--ink);font-weight:600">'+last.v+"</text>"+
     '<line id="hx" x1="0" x2="0" y1="'+mt+'" y2="'+(mt+ph)+'" stroke="var(--ink3)" stroke-width="1" visibility="hidden"/>'+
     '<circle id="hd" r="4" fill="var(--accent)" stroke="var(--card)" stroke-width="2" visibility="hidden"/>'+
     '<rect id="hr" x="'+ml+'" y="'+mt+'" width="'+pw+'" height="'+ph+'" fill="transparent"/>';
  el.innerHTML='<svg viewBox="0 0 '+W+" "+Ht+'" role="img" aria-label="Tests passing each day since August, now '+last.v+'">'+g+"</svg>";
  var tip=null;
  function at(e){
    var b=el.getBoundingClientRect(),x=(e.clientX-b.left)/b.width*W,best=pts[0];
    pts.forEach(function(p){if(Math.abs(X(p.t)-x)<Math.abs(X(best.t)-x))best=p});
    var hx=el.querySelector("#hx"),hdot=el.querySelector("#hd");
    hx.setAttribute("x1",X(best.t));hx.setAttribute("x2",X(best.t));hx.setAttribute("visibility","visible");
    hdot.setAttribute("cx",X(best.t));hdot.setAttribute("cy",Y(best.v));hdot.setAttribute("visibility","visible");
    if(!tip){tip=document.createElement("div");tip.className="tip";el.appendChild(tip)}
    tip.textContent=day(best.d+"T12:00")+" · "+best.v+" passing";tip.hidden=false;
    tip.style.left=Math.max(70,Math.min(b.width-70,X(best.t)/W*b.width))+"px";tip.style.top=(Y(best.v)/Ht*b.height-10)+"px";
  }
  function off(){if(tip)tip.hidden=true;var a=el.querySelector("#hx"),c=el.querySelector("#hd");if(a)a.setAttribute("visibility","hidden");if(c)c.setAttribute("visibility","hidden")}
  var r=el.querySelector("#hr");r.addEventListener("pointermove",at);r.addEventListener("pointerdown",at);
  r.addEventListener("pointerleave",function(e){if(e.pointerType!=="touch")off()});   /* a tap keeps its label until the next tap */
}
var histTimer=null;window.addEventListener("resize",function(){clearTimeout(histTimer);histTimer=setTimeout(drawHistory,150)});

function livesCard(L){
  var W=340,H=176,ml=30,mr=6,mt=12,mb=22,pw=W-ml-mr,ph=H-mt-mb,n=L.learner.length;
  var top=Math.max(700,Math.ceil(Math.max.apply(null,L.learner.concat(L.twin||[],[L.nothing]))/100)*100);
  var y=function(v){return mt+ph-(v/top)*ph}, band=pw/n, bw=Math.min(24,Math.round(band*0.58)), g="";
  [0,200,400,600].filter(function(t){return t<=top}).forEach(function(t){g+='<line x1="'+ml+'" x2="'+(W-mr)+'" y1="'+y(t)+'" y2="'+y(t)+'" stroke="var(--line)" stroke-width="1"/><text x="'+(ml-6)+'" y="'+(y(t)+3)+'" text-anchor="end">'+t+"</text>"});
  g+='<line x1="'+ml+'" x2="'+(W-mr)+'" y1="'+y(L.nothing)+'" y2="'+y(L.nothing)+'" stroke="var(--ink3)" stroke-width="1"/><text x="'+(W-mr)+'" y="'+(y(L.nothing)-5)+'" text-anchor="end">doing nothing lasts '+Math.round(L.nothing)+" s</text>";
  L.learner.forEach(function(v,i){
    var x=ml+i*band+(band-bw)/2,yy=y(v),hh=mt+ph-yy,r=Math.min(4,hh);
    g+='<path d="M'+x+","+(mt+ph)+"V"+(yy+r)+"q0,-"+r+" "+r+",-"+r+"H"+(x+bw-r)+"q"+r+",0 "+r+","+r+"V"+(mt+ph)+'Z" fill="var(--accent)"/>';
    if(i===0||i===n-1||(i+1)%5===0)g+='<text x="'+(x+bw/2)+'" y="'+(H-7)+'" text-anchor="middle">'+(i+1)+"</text>";
  });
  if(L.twin){
    var pts=L.twin.map(function(v,i){return (ml+i*band+band/2).toFixed(1)+","+y(v).toFixed(1)});
    g+='<polyline points="'+pts.join(" ")+'" fill="none" stroke="var(--card)" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>'+
       '<polyline points="'+pts.join(" ")+'" fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    var e=pts[pts.length-1].split(",");
    g+='<circle cx="'+e[0]+'" cy="'+e[1]+'" r="4" fill="var(--ink2)" stroke="var(--card)" stroke-width="2"/>';
  }
  L.learner.forEach(function(v,i){g+='<rect class="hit" data-i="'+i+'" x="'+(ml+i*band)+'" y="'+mt+'" width="'+band+'" height="'+ph+'" fill="transparent" tabindex="0" aria-label="Life '+(i+1)+": Jack "+Math.round(v)+" seconds"+(L.twin?", untrained twin "+Math.round(L.twin[i])+" seconds":"")+'"/>'});
  var rows=L.learner.map(function(v,i){return "<tr><td>"+(i+1)+"</td><td>"+num(v,0)+"</td>"+(L.twin?"<td>"+num(L.twin[i],0)+"</td>":"")+"</tr>"}).join("");
  return '<div class="card"><h2>Fifteen lives, one after another</h2><p class="sub">How long each life lasted, in seconds, in one run of the test that asks whether living teaches him ('+day(L.ran)+'). If he were learning, the bars would climb past the line.</p>'+
